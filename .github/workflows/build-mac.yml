name: Build AU (macOS)
on:
  push:
    branches: [ jackpot-plugins ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: |
          cmake --build build --config Release --target Jackpot60_AU -- -quiet
          cmake --build build --config Release --target JackpotTape_AU -- -quiet
          cmake --build build --config Release --target JackpotPad_AU -- -quiet
          cmake --build build --config Release --target JackpotPad_VST3 -- -quiet
      - name: Firma, validazione, zip
        run: |
          mkdir -p out ~/Library/Audio/Plug-Ins/Components
          for NAME in "Jackpot 60" "Jackpot Tape" "Jackpot Pad"; do
            C="$(find build -name "$NAME.component" -type d | head -1)"
            echo "trovato: $C"
            codesign --force --deep -s - "$C"
            cp -R "$C" ~/Library/Audio/Plug-Ins/Components/
            cp -R "$C" out/
          done
          V="$(find build -name 'Jackpot Pad.vst3' -type d | head -1)"
          codesign --force --deep -s - "$V"
          cp -R "$V" out/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Jk60 Jkpt | tail -5 || true
          auval -v aufx Jtap Jkpt | tail -5 || true
          auval -v aumu Jpad Jkpt | tail -5 || true
          cd out
          ditto -c -k --keepParent "Jackpot 60.component" "Jackpot60-AU.zip"
          ditto -c -k --keepParent "Jackpot Tape.component" "JackpotTape-AU.zip"
          ditto -c -k --keepParent "Jackpot Pad.component" "JackpotPad-AU.zip"
          ditto -c -k --keepParent "Jackpot Pad.vst3" "JackpotPad-VST3.zip"
          ditto -c -k --sequesterRsrc . "../Jackpot-Plugins-AU.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Jackpot-Plugins-AU
          path: out/*.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="plugins-v1.0.${{ github.run_number }}"
          gh release create "$TAG" out/Jackpot60-AU.zip out/JackpotTape-AU.zip out/JackpotPad-AU.zip out/JackpotPad-VST3.zip \
            --target "${{ github.sha }}" --title "Jackpot Pad + Jackpot 60 + Jackpot Tape (AU) $TAG" \
            --notes "Plugin Audio Unit per macOS (Apple Silicon e Intel). Scompatta, copia i .component in ~/Library/Audio/Plug-Ins/Components, poi: xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/Jackpot*.component"
