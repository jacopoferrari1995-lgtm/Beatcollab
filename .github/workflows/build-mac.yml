name: Build AU (macOS)
on:
  push:
    branches: [ jackpot-plugins ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  au:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: JUCE 8.0.4
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE
      - name: Configure
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DJACKPOT_VERSION=1.1.${{ github.run_number }}
      - name: Build, firma, validazione, zip
        run: |
          # cartella | nome del prodotto | tipo e codice per auval | nome dello zip
          cat > plugins.txt <<'EOF'
          JackpotTape|Jackpot Tape|aufx Jtap|JackpotTape
          JackpotPad|Jackpot Sampler|aumu Jpad|JackpotSampler
          JackpotButter|Jackpot Butter Rack|aufx Jbtr|JackpotButterRack
          JackpotComp|Jackpot Studio Comp|aufx Jcmp|JackpotStudioComp
          JackpotMeter|Jackpot Metering Hub|aufx Jmtr|JackpotMeteringHub
          JackpotAlter|Jackpot Alter Drive|aufx Jalt|JackpotAlterDrive
          JackpotMaster|Jackpot Master|aufx Jmst|JackpotMaster
          JackpotMotion|Jackpot Motion|aufx Jmot|JackpotMotion
          JackpotDust|Jackpot Dust|aufx Jdst|JackpotDust
          JackpotClip|Jackpot Clip|aufx Jclp|JackpotClip
          JackpotMix|Jackpot Mixology|aufx Jmix|JackpotMixology
          JackpotPhase|Jackpot Phase|aufx Jphs|JackpotPhase
          JackpotTube|Jackpot Tube Box|aufx Jtbx|JackpotTubeBox
          JackpotRewind|Jackpot Rewind|aufx Jrwd|JackpotRewind
          JackpotFX|Jackpot FX|aumf Jfx8|JackpotFX
          EOF
          # build-only.txt: se c'e' ed e' pieno, si costruiscono solo quei plugin (piu veloce)
          ONLY=""; [ -f build-only.txt ] && ONLY="$(tr -s ' \n' ' ' < build-only.txt)"
          echo "solo: '$ONLY'"
          mkdir -p out ~/Library/Audio/Plug-Ins/Components
          while IFS='|' read -r DIR NAME AU ZIP; do
            DIR="$(echo $DIR)"; [ -z "$DIR" ] && continue
            if [ -n "$ONLY" ] && ! echo " $ONLY " | grep -q " $DIR "; then continue; fi
            cmake --build build --config Release --target "${DIR}_AU" -- -quiet
            C="$(find build -name "$NAME.component" -type d | head -1)"
            codesign --force --deep -s - "$C"
            cp -R "$C" ~/Library/Audio/Plug-Ins/Components/
            cp -R "$C" out/
            (cd out && ditto -c -k --keepParent "$NAME.component" "$ZIP-AU.zip")
            if [ "$DIR" = "JackpotPad" ] || [ "$DIR" = "JackpotFX" ]; then
              cmake --build build --config Release --target "${DIR}_VST3" -- -quiet
              V="$(find build -name "$NAME.vst3" -type d | head -1)"
              codesign --force --deep -s - "$V"; cp -R "$V" out/
              (cd out && ditto -c -k --keepParent "$NAME.vst3" "$ZIP-VST3.zip")
            fi
            echo "$AU" >> auval.txt
          done < plugins.txt
          killall -9 AudioComponentRegistrar || true
          while read -r T C; do auval -v $T $C Jkpt | tail -5 || true; done < auval.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jackpot-Plugins
          path: out/*.zip
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="plugins-v1.1.${{ github.run_number }}"
          gh release create "$TAG" out/*.zip \
            --target "${{ github.sha }}" --title "Jackpot Plugins $TAG" \
            --notes "Plugin per macOS (Apple Silicon e Intel). Copia i .component in ~/Library/Audio/Plug-Ins/Components (e il .vst3 in ~/Library/Audio/Plug-Ins/VST3), poi: xattr -dr com.apple.quarantine ~/Library/Audio/Plug-Ins/Components/Jackpot*.component"
