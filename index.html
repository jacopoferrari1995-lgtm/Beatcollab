<html lang="it">
<head>

<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQmVhdENvbGxhYiIsInNob3J0X25hbWUiOiJCZWF0Q29sbGFiIiwic3RhcnRfdXJsIjoiLiIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwODA4MGEiLCJ0aGVtZV9jb2xvciI6IiNkYzI2MjYifQ==">
<title>BeatCollab</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--bg2:#111114;--bg3:#19191e;--card:#131316;--acc:#dc2626;--accH:#ef4444;--accM:rgba(220,38,38,.12);--tx:#f0f0f0;--tx2:#888;--tx3:#555;--brd:#222228;--play:#0c0c0e;--side:#0a0a0c;--grad:linear-gradient(135deg,#dc2626,#991b1b)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;height:100vh;height:100dvh;font-size:14px;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
input,select,textarea,button{font-family:inherit;outline:none}
.i{width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--tx);font-size:14px}
.s{padding:10px 14px;border-radius:8px;border:1px solid var(--brd);background:var(--bg2);color:var(--tx);font-size:14px;cursor:pointer}
.t{width:100%;padding:14px;border-radius:10px;border:1px solid var(--brd);background:var(--bg2);color:var(--tx);font-size:14px;min-height:140px;resize:vertical;line-height:1.6}
.bp{padding:9px 18px;border-radius:8px;border:none;cursor:pointer;font-weight:600;font-size:13px;background:var(--grad);color:#fff;display:inline-flex;align-items:center;gap:7px;transition:all .12s}.bp:hover{filter:brightness(1.1)}
.bg{padding:9px 18px;border-radius:8px;border:1px solid var(--brd);cursor:pointer;font-weight:500;font-size:13px;background:transparent;color:var(--tx2);display:inline-flex;align-items:center;gap:7px;transition:all .12s}.bg:hover{border-color:var(--acc);color:var(--acc)}
.c{background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:18px;transition:border-color .12s}.c:hover{border-color:color-mix(in srgb,var(--acc),transparent 50%)}
.cc{cursor:pointer}.cc:hover{transform:translateY(-2px)}
.b{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:var(--accM);color:var(--acc)}
.tg{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;background:var(--bg3);color:var(--tx2);margin-right:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(5px)}
.mo{background:var(--card);border-radius:16px;border:1px solid var(--brd);padding:24px;width:calc(100% - 32px);max-width:540px;max-height:85vh;overflow-y:auto}
.tb{padding:10px 14px;border-radius:8px 8px 0 0;cursor:pointer;font-size:13px;border:none;font-family:inherit;white-space:nowrap;background:transparent;color:var(--tx2);border-bottom:2px solid transparent;transition:all .12s}.tb.a{background:var(--accM);color:var(--acc);font-weight:700;border-bottom-color:var(--acc)}
.si{display:flex;align-items:center;gap:12px;padding:10px 18px;margin:2px 8px;border-radius:10px;cursor:pointer;transition:all .1s;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden}.si:hover{background:var(--bg3)}.si.a{background:var(--accM);color:var(--acc);font-weight:600}
.uz{position:relative;text-align:center;padding:40px 20px;color:var(--tx3);background:var(--bg2);border-radius:12px;border:2px dashed var(--brd);cursor:pointer;transition:all .12s}.uz:hover{border-color:var(--acc);background:var(--accM)}.uz input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.ub{position:relative;overflow:hidden;border-radius:8px;display:inline-flex}.ub input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.r{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;transition:background .1s}.r:hover{background:var(--bg3)}.r.act{background:var(--accM)}
.ib{background:none;border:none;cursor:pointer;padding:2px;flex-shrink:0;color:var(--tx2);transition:color .1s}.ib:hover{color:var(--acc)}
.eb{display:inline-flex;background:var(--bg3);border:1px solid var(--brd);border-radius:16px;padding:2px 8px;font-size:14px;cursor:pointer;transition:all .1s;margin:2px}.eb:hover{background:var(--accM);border-color:var(--acc)}
.cm{margin-bottom:12px;padding:10px 14px;background:var(--bg2);border-radius:10px;border:1px solid var(--brd)}.cm.mi{border-left:2px solid var(--acc)}
.pb{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}.pf{height:100%;background:var(--grad);border-radius:3px;transition:width .2s}
.sc{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:18px;margin-bottom:12px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px;font-weight:700}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.fl{font-size:11px;color:var(--tx2);margin-bottom:3px;display:block}
.wv{width:100%;height:48px;border-radius:6px;cursor:pointer}
@keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.fi{animation:fi .2s ease}
/* Mobile */
@media(max-width:768px){
  .desk{display:none!important}
  .mob-tabs{display:flex!important}
  body{overflow:auto}
}
@media(min-width:769px){
  .mob-tabs{display:none!important}
}
.mob-tabs{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--play);border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-around;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
.mob-tabs button{background:none;border:none;color:var(--tx3);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:6px 10px;border-radius:8px;font-family:inherit}.mob-tabs button.a{color:var(--acc);background:var(--accM)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s),uid=()=>Math.random().toString(36).slice(2,9),now=()=>Date.now();
const fmt=s=>{if(!s||!isFinite(s))return"0:00";return Math.floor(s/60)+":"+Math.floor(s%60).toString().padStart(2,"0")};
const esc=s=>s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'):'';
const mob=()=>window.innerWidth<769;

// ═══ STATE ═══
const S={
  in:false,role:null,user:null,theme:'crimsonNight',
  pg:'home',spid:null,said:null,ptab:'brano',atab:'progetti',sb:true,
  artists:[
    {id:"a1",name:"Onga",image:null,bio:"Artista urban emergente",genre:"Trap",email:"onga@mail.com",social:"@onga",spotify:"",instagram:"",pw:"1234"},
    {id:"a2",name:"Jody",image:null,bio:"Cantautore R&B / Soul",genre:"R&B",email:"jody@mail.com",social:"@jody",spotify:"",instagram:"",pw:"123"},
  ],
  projects:[],tracks:[],
  pl:[{id:"pl1",name:"I miei preferiti",tids:[]}],
  msgs:[{id:"m0",u:"Sistema",txt:"Benvenuti su BeatCollab! 🎹",ts:now(),pid:null,tp:"sys",att:[]}],
  creqs:[],notifs:[],
  // player
  tid:null,play:false,ct:0,vol:.8,shuf:false,rep:false,
  // ui
  upl:false,upP:0,upN:'',srch:'',
  lg:'all',ls:'recent',splid:null,cf:'all',
  auto:true,vis:{collab:1,library:0,charts:0},
};

const TH={
  crimsonNight:{n:"Crimson Night",e:"🔴",bg:"#08080a",b2:"#111114",b3:"#19191e",cd:"#131316",ac:"#dc2626",am:"rgba(220,38,38,.12)",tx:"#f0f0f0",t2:"#888",t3:"#555",bd:"#222228",pl:"#0c0c0e",sd:"#0a0a0c",gr:"linear-gradient(135deg,#dc2626,#991b1b)"},
  warmSlate:{n:"Warm Slate",e:"🟠",bg:"#0c0b09",b2:"#15140f",b3:"#1e1c16",cd:"#141310",ac:"#c2884a",am:"rgba(194,136,74,.10)",tx:"#e8e4dc",t2:"#8a8478",t3:"#5c5850",bd:"#28261e",pl:"#0e0d0a",sd:"#0a0908",gr:"linear-gradient(135deg,#c2884a,#8a5e30)"},
  deepOcean:{n:"Deep Ocean",e:"🔵",bg:"#060a10",b2:"#0c1220",b3:"#141e30",cd:"#0e1524",ac:"#3b82f6",am:"rgba(59,130,246,.10)",tx:"#dce4f0",t2:"#6880a0",t3:"#3e5070",bd:"#1a2640",pl:"#080e18",sd:"#060a12",gr:"linear-gradient(135deg,#2563eb,#1e40af)"},
  forestMoss:{n:"Forest Moss",e:"🟢",bg:"#080a08",b2:"#101410",b3:"#181e18",cd:"#0e120e",ac:"#4a9a5a",am:"rgba(74,154,90,.10)",tx:"#dce4dc",t2:"#708870",t3:"#4a5e4a",bd:"#1e2a1e",pl:"#0a0e0a",sd:"#06080a",gr:"linear-gradient(135deg,#4a9a5a,#2d6e3a)"},
  studioLight:{n:"Studio Light",e:"⚪",bg:"#f5f5f4",b2:"#fff",b3:"#ececea",cd:"#fff",ac:"#292524",am:"rgba(41,37,36,.06)",tx:"#1c1917",t2:"#78716c",t3:"#a8a29e",bd:"#d6d3d1",pl:"#fafaf9",sd:"#f5f5f4",gr:"linear-gradient(135deg,#292524,#0c0a09)"},
  purpleDusk:{n:"Purple Dusk",e:"🟣",bg:"#0a080e",b2:"#141020",b3:"#1e1830",cd:"#110e1c",ac:"#9070d0",am:"rgba(144,112,208,.10)",tx:"#e4e0f0",t2:"#8880a0",t3:"#585068",bd:"#241e38",pl:"#0c0a12",sd:"#08060c",gr:"linear-gradient(135deg,#9070d0,#6040a0)"},
};
const GEN=["Hip-Hop","Trap","R&B","Pop","Drill","Afrobeat","Reggaeton","Lo-Fi","House","Techno","Soul","Boom Bap"];
const SCA=["C Maj","C Min","D Maj","D Min","E Min","F Maj","F# Min","G Maj","G Min","A Min","Bb Maj","B Min"];
const MOO=["Dark","Melodic","Aggressive","Chill","Bouncy","Experimental","Emotional","Hard","Smooth","Ambient"];
const PTY=["Singolo","EP","Disco"];
const TABS=[{id:"brano",l:"♫ Brano"},{id:"recording",l:"🎙 Recording"},{id:"testo",l:"📝 Testo"},{id:"note",l:"💬 Note"},{id:"idea",l:"💡 Idea"},{id:"mix",l:"🎛 Mix"},{id:"master",l:"🏆 Master"},{id:"compenso",l:"💰 Compenso"}];
const EMO=["🔥","❤️","👏","💯","🎵","😍","👀","💪","😂","🙌"];
const MNAV=[{id:'home',l:'Home',ic:'🏠'},{id:'projects',l:'Progetti',ic:'📁'},{id:'artists',l:'Artisti',ic:'👥'},{id:'collab',l:'Collab',ic:'💬'},{id:'settings',l:'Altro',ic:'⚙️'}];

// ═══ HELPERS ═══
const au=new Audio();au.preload='auto';
au.ontimeupdate=()=>{S.ct=au.currentTime;uPl()};
au.onended=()=>{S.ct=0;if(S.rep){au.currentTime=0;au.play();return}pNx()};
au.onloadedmetadata=()=>{const t=gt(S.tid);if(t&&au.duration&&isFinite(au.duration)){t.dur=au.duration;uPl();drawWave()}};
function th(){const t=TH[S.theme],r=document.documentElement.style;r.setProperty('--bg',t.bg);r.setProperty('--bg2',t.b2);r.setProperty('--bg3',t.b3);r.setProperty('--card',t.cd);r.setProperty('--acc',t.ac);r.setProperty('--accM',t.am);r.setProperty('--tx',t.tx);r.setProperty('--tx2',t.t2);r.setProperty('--tx3',t.t3);r.setProperty('--brd',t.bd);r.setProperty('--play',t.pl);r.setProperty('--side',t.sd);r.setProperty('--grad',t.gr);document.querySelector('meta[name=theme-color]')?.setAttribute('content',t.bg)}
function gt(id){return S.tracks.find(x=>x.id===id)}
function gp(id){return S.projects.find(x=>x.id===id)}
function ga(id){return S.artists.find(x=>x.id===id)}
function vT(){return S.role==='bm'?S.tracks:S.tracks.filter(t=>t.aid===S.user?.aid)}
function vP(){return S.role==='bm'?S.projects:S.projects.filter(p=>p.aid===S.user?.aid)}
function vA(){return S.role==='bm'?S.artists:S.artists.filter(a=>a.id===S.user?.aid)}
function ntf(t){S.notifs.unshift({id:uid(),t,ts:now(),r:0})}
function q(){return vT().filter(t=>t.url)}

// ═══ SEARCH ═══
function doSearch(q){
  if(!q)return[];q=q.toLowerCase();
  const r=[];
  S.projects.forEach(p=>{if(p.title.toLowerCase().includes(q)||p.artistName.toLowerCase().includes(q))r.push({type:'project',id:p.id,name:p.title,sub:p.artistName})});
  S.artists.forEach(a=>{if(a.name.toLowerCase().includes(q))r.push({type:'artist',id:a.id,name:a.name,sub:a.genre})});
  S.tracks.forEach(t=>{if(t.name.toLowerCase().includes(q))r.push({type:'track',id:t.id,name:t.name,sub:ga(t.aid)?.name||''})});
  return r.slice(0,8);
}
function goResult(r){
  if(r.type==='project'){S.spid=r.id;S.ptab='brano';S.pg='pd'}
  else if(r.type==='artist'){S.said=r.id;S.atab='progetti';S.pg='ad'}
  else if(r.type==='track'){play(r.id)}
  S.srch='';R();
}

// ═══ AUDIO ═══
function play(id){const t=gt(id);if(!t)return;if(S.tid===id){if(S.play){au.pause();S.play=0}else au.play().then(()=>{S.play=1}).catch(()=>{});uPl();uPC();return}S.tid=id;S.ct=0;t.plays=(t.plays||0)+1;if(t.url){au.pause();au.src=t.url;au.load();au.play().then(()=>{S.play=1;uPl();uPC();drawWave()}).catch(()=>{S.play=0;uPl();uPC()})}else{au.pause();S.play=0}uPl();uPC()}
function pNx(){const L=q();if(!L.length){S.play=0;uPl();return}const i=L.findIndex(t=>t.id===S.tid);let n;if(S.shuf)n=Math.floor(Math.random()*L.length);else n=i>=0?(i+1)%L.length:0;play(L[n].id)}
function pPv(){const L=q();if(!L.length)return;if(au.currentTime>3){au.currentTime=0;S.ct=0;uPl();return}const i=L.findIndex(t=>t.id===S.tid);play(L[i>0?i-1:L.length-1].id)}
function sk(p){const d=au.duration||0;if(d&&isFinite(d)){au.currentTime=p*d;S.ct=p*d}}
function gd(t){if(S.tid===t.id&&au.duration&&isFinite(au.duration))return au.duration;return t.dur||0}

// ═══ WAVEFORM ═══
function drawWave(){
  const cv=$('#waveform');if(!cv)return;const ctx=cv.getContext('2d');const w=cv.width=cv.offsetWidth*2;const h=cv.height=96;ctx.clearRect(0,0,w,h);
  const T=TH[S.theme];const bars=80;for(let i=0;i<bars;i++){const v=Math.random()*.6+.2;const bw=w/bars*.7;const x=i*(w/bars);ctx.fillStyle=T.am;ctx.fillRect(x,h/2-v*h/2,bw,v*h);}}

// ═══ UPLOAD ═══
function upl(files,pid,aid){if(!files||!files.length)return;const exts=["mp3","wav","flac","ogg","m4a","aac","mp4","webm","opus","wma","aiff"];let d=0,tot=files.length;
  Array.from(files).forEach(f=>{S.upl=1;S.upN=f.name;S.upP=0;uUB();
    const url=URL.createObjectURL(f);let st=0;const iv=setInterval(()=>{st++;S.upP=Math.min(Math.round(st/10*100),99);uUB();if(st>=10){clearInterval(iv);S.upP=100;uUB();
      const ver=S.tracks.filter(t=>t.pid===pid&&t.name===f.name).length+1;
      const nt={id:'t'+uid(),name:f.name,dur:0,pid,aid,genre:gp(pid)?.genre||'Hip-Hop',plays:0,at:now(),url,sz:f.size,ver};
      S.tracks.unshift(nt);d++;if(d>=tot){setTimeout(()=>{S.upl=0;S.upP=0;play(nt.id);ntf('Traccia "'+f.name+'" caricata');R()},300)}}},50)});}
function dl(t){if(!t||!t.url)return;const a=document.createElement('a');a.href=t.url;a.download=t.name;document.body.appendChild(a);a.click();document.body.removeChild(a)}

// ═══ EXPORT ZIP (project) ═══
function exportProj(pid){
  const p=gp(pid);if(!p)return;
  const info=JSON.stringify(p,null,2);
  const blob=new Blob([info],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=p.title+'_info.json';document.body.appendChild(a);a.click();document.body.removeChild(a);
  // Also download each track
  S.tracks.filter(t=>t.pid===pid).forEach(t=>dl(t));
  ntf('Progetto "'+p.title+'" esportato');
}

// ═══ CRUD ═══
function delP(id){if(!confirm('Eliminare progetto e tracce?'))return;S.tracks.filter(t=>t.pid===id).forEach(t=>{if(t.url)URL.revokeObjectURL(t.url)});S.tracks=S.tracks.filter(t=>t.pid!==id);S.projects=S.projects.filter(p=>p.id!==id);if(S.tid&&!gt(S.tid)){au.pause();S.tid=null;S.play=0}if(S.spid===id){S.spid=null;S.pg='home'}ntf('Progetto eliminato');R()}
function delA(id){if(!confirm('Eliminare artista e collegati?'))return;S.projects=S.projects.filter(p=>p.aid!==id);S.tracks=S.tracks.filter(t=>t.aid!==id);S.artists=S.artists.filter(a=>a.id!==id);if(S.said===id){S.said=null;S.pg='artists'}ntf('Artista eliminato');R()}
function delT(id){if(S.tid===id){au.pause();S.tid=null;S.play=0}const t=gt(id);if(t?.url)URL.revokeObjectURL(t.url);S.tracks=S.tracks.filter(x=>x.id!==id);S.pl.forEach(p=>{p.tids=p.tids.filter(x=>x!==id)});R()}

// ═══ COLLAB ═══
function sMsg(){const el=$('#ci');if(!el)return;const t=el.value.trim();if(!t)return;S.msgs.push({id:'m'+uid(),u:S.user?.name||'User',txt:t,ts:now(),pid:S.cf!=='all'?S.cf:null,tp:'txt',att:[]});el.value='';uCh()}
function sEmo(e){S.msgs.push({id:'m'+uid(),u:S.user?.name||'User',txt:e,ts:now(),pid:S.cf!=='all'?S.cf:null,tp:'emo',att:[]});uCh()}
function cAtt(files){if(!files?.length)return;Array.from(files).forEach(f=>{const isI=f.type.startsWith('image/'),isA=f.type.startsWith('audio/'),isP=f.name.endsWith('.pdf');let pv='',url='';if(isI){url=URL.createObjectURL(f);pv='<img src="'+url+'" style="max-width:220px;max-height:140px;border-radius:8px;margin-top:6px;display:block">'}else if(isA){url=URL.createObjectURL(f);pv='<audio controls src="'+url+'" style="margin-top:6px;width:100%;max-width:300px;height:32px"></audio>'}else if(isP){url=URL.createObjectURL(f)}
    S.msgs.push({id:'m'+uid(),u:S.user?.name||'User',txt:(isI?'🖼 ':isA?'🎵 ':isP?'📕 ':'📄 ')+f.name+' ('+(f.size/1048576).toFixed(1)+' MB)',ts:now(),pid:S.cf!=='all'?S.cf:null,tp:'file',att:[{name:f.name,tp:isI?'img':isA?'aud':'doc',url,pv}]})});uCh()}
function cReq(aid){const a=ga(aid);if(!a)return;S.creqs.push({id:'cr'+uid(),from:S.user?.name,to:aid,ts:now(),st:'pending'});S.msgs.push({id:'m'+uid(),u:'Sistema',txt:'📩 '+S.user?.name+' → richiesta collab a '+a.name,ts:now(),pid:null,tp:'sys',att:[]});ntf('Richiesta collab → '+a.name);uCh()}
function uCh(){const el=$('#cha');if(!el){R();return}const ms=S.cf==='all'?S.msgs:S.msgs.filter(m=>m.pid===S.cf);
  el.innerHTML=ms.map(m=>{const mi=m.u===S.user?.name;const sy=m.tp==='sys';const em=m.tp==='emo';return`<div class="cm ${mi?'mi':''}" ${sy?'style="background:transparent;border:none;padding:3px 14px;opacity:.6"':''}>
    ${!em?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:3px"><b style="font-size:12px;color:${mi?'var(--acc)':sy?'var(--tx3)':'var(--tx)'}">${esc(m.u)}</b><span style="font-size:10px;color:var(--tx3)">${new Date(m.ts).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span>${m.pid&&gp(m.pid)?'<span class="tg">'+esc(gp(m.pid).title)+'</span>':''}</div>`:''}
    ${em?`<div style="display:flex;align-items:center;gap:8px"><span style="font-size:28px">${esc(m.txt)}</span><span style="font-size:10px;color:var(--tx3)">${esc(m.u)}</span></div>`:`<p style="font-size:13px;color:${sy?'var(--tx3)':'var(--tx2)'};line-height:1.4;margin:0">${esc(m.txt)}</p>`}

    <div style="grid-column:1/-1"><span class="fl">Artista *</span><select id="pfa" class="s" style="width:100%"><option value="">Seleziona</option>${S.artists.map(a=>`<option value="${a.id}" ${p?.aid===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
    <div><span class="fl">BPM</span><input id="pfb" class="i" type="number" value="${p?.bpm||120}"></div>
    <div><span class="fl">Scala</span><select id="pfs" class="s" style="width:100%">${SCA.map(s=>`<option ${p?.scale===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div><span class="fl">Mood</span><select id="pfm" class="s" style="width:100%">${MOO.map(m=>`<option ${p?.mood===m?'selected':''}>${m}</option>`).join('')}</select></div>
    <div><span class="fl">Genere</span><select id="pfg" class="s" style="width:100%">${GEN.map(g=>`<option ${p?.genre===g?'selected':''}>${g}</option>`).join('')}</select></div>
    <div><span class="fl">Tipo</span><select id="pfy" class="s" style="width:100%">${PTY.map(t=>`<option ${p?.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><span class="fl">Durata</span><input id="pfd" class="i" value="${esc(p?.duration||'')}" placeholder="3:30"></div>
  </div>
  <button class="bp" style="width:100%;justify-content:center;margin-top:16px;padding:11px 0" onclick="sPF('${eid||''}')">✓ ${p?'Salva':'Crea'}</button>
</div></div>`)}
function sPF(eid){const t=$('#pft').value,ai=$('#pfa').value;if(!t||!ai)return;const a=ga(ai);const d={title:t,aid:ai,artistName:a?.name||'',bpm:+$('#pfb').value||120,scale:$('#pfs').value,mood:$('#pfm').value,genre:$('#pfg').value,type:$('#pfy').value,duration:$('#pfd').value};if(eid){const p=gp(eid);if(p)Object.assign(p,d)}else{S.projects.unshift({id:'p'+uid(),...d,cover:null,status:'active',createdAt:now(),sec:{}});ntf('Progetto "'+t+'" creato')}$('.ov')?.remove();R()}

function oAF(eid){const a=eid?ga(eid):null;document.body.insertAdjacentHTML('beforeend',`<div class="ov" onclick="if(event.target===this)this.remove()"><div class="mo">
  <div style="display:flex;justify-content:space-between;margin-bottom:16px"><h2 style="font-size:16px;font-weight:700">${a?'Modifica':'Nuovo'} Artista</h2><button class="ib" onclick="this.closest('.ov').remove()" style="font-size:16px">✕</button></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
    <div style="grid-column:1/-1"><span class="fl">Nome *</span><input id="afn" class="i" value="${esc(a?.name||'')}"></div>
    <div><span class="fl">Genere</span><select id="afg" class="s" style="width:100%">${GEN.map(g=>`<option ${a?.genre===g?'selected':''}>${g}</option>`).join('')}</select></div>
    <div><span class="fl">Password</span><input id="afp" class="i" value="${esc(a?.pw||'')}"></div>
    <div><span class="fl">Email</span><input id="afe" class="i" value="${esc(a?.email||'')}"></div>
    <div><span class="fl">Social</span><input id="afs" class="i" value="${esc(a?.social||'')}"></div>
    <div><span class="fl">Spotify</span><input id="afsp" class="i" value="${esc(a?.spotify||'')}" placeholder="https://open.spotify.com/..."></div>
    <div><span class="fl">Instagram</span><input id="afig" class="i" value="${esc(a?.instagram||'')}" placeholder="@username"></div>
    <div style="grid-column:1/-1"><span class="fl">Bio</span><textarea id="afb" class="t" style="min-height:50px">${esc(a?.bio||'')}</textarea></div>
  </div>
  <button class="bp" style="width:100%;justify-content:center;margin-top:16px;padding:11px 0" onclick="sAF('${eid||''}')">✓ ${a?'Salva':'Aggiungi'}</button>
</div></div>`)}
function sAF(eid){const n=$('#afn').value;if(!n)return;const d={name:n,genre:$('#afg').value,pw:$('#afp').value,email:$('#afe').value,social:$('#afs').value,spotify:$('#afsp').value,instagram:$('#afig').value,bio:$('#afb').value};if(eid){const a=ga(eid);if(a)Object.assign(a,d)}else{S.artists.unshift({id:'a'+uid(),...d,image:null});ntf('Artista "'+n+'" aggiunto')}$('.ov')?.remove();R()}

// ═══ AUTO DARK MODE ═══
if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme:light)');
  const check=()=>{if(mq.matches&&S.theme==='crimsonNight')S.theme='studioLight';if(!mq.matches&&S.theme==='studioLight')S.theme='crimsonNight';};
  try{mq.addEventListener('change',()=>{check();R()})}catch(e){mq.addListener(()=>{check();R()})}
}

// ═══ TIMESTAMP NOTES ═══
// After render, parse [m:ss] in notes and make them clickable
function parseTimestamps(){
  const ta=$('#notes-ta');const el=$('#ts-links');if(!ta||!el)return;
  const matches=ta.value.match(/\[\d+:\d{2}\]/g);if(!matches||!matches.length){el.innerHTML='';return}
  el.innerHTML=matches.map(m=>{const t=m.slice(1,-1);const parts=t.split(':');const sec=parseInt(parts[0])*60+parseInt(parts[1]);return`<button class="eb" onclick="sk(${sec}/(au.duration||1));au.play().then(()=>{S.play=1;uPl()}).catch(()=>{})">${m}</button>`}).join('')}
// Run after each render for notes tab
const origR=R;
// We'll call parseTimestamps in a MutationObserver pattern instead
setInterval(parseTimestamps,500);

// ═══ INIT ═══
R();
</script>
